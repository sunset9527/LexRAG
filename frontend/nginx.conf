server {
    listen 3000;
    server_name localhost;
    # Mirrors the application-level 50 MiB upload batch ceiling.
    client_max_body_size 50m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker's embedded DNS must be consulted at request time. A Compose
    # service can be recreated with a different container IP during recovery.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api;

    # API 反向代理
    location /api/ {
        # Strip the browser-only /api prefix before proxying to FastAPI.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长超时（法律问答可能较慢）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        # A future streaming endpoint must not be delayed by proxy buffering.
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering "no";
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
