services:
  api:
    build:
      context: .
      target: api
    container_name: lexrag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-your-key-here}
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma_db
      - law_data:/app/data
    networks:
      - lexrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      target: frontend
    container_name: lexrag-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-your-key-here}
      - API_BASE_URL=http://api:8000
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma_db
      - law_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lexrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
    driver: local
  law_data:
    driver: local

networks:
  lexrag-network:
    driver: bridge
