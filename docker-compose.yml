services:
  api:
    build:
      context: .
      target: api
    container_name: lexrag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-your-key-here}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Database (MySQL)
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-123456}@host.docker.internal:3306/lexrag?charset=utf8mb4
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production}
      # Langfuse
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - chroma_data:/app/data/chroma_db
      - law_data:/app/data
    depends_on:
      redis:
        condition: service_started
    networks:
      - lexrag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==================== v1.8: Vue 3 前端 ====================

  vue:
    build:
      context: ./frontend
    container_name: lexrag-vue
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lexrag-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lexrag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lexrag-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chroma_data:
    driver: local
  law_data:
    driver: local
  redis_data:
    driver: local

networks:
  lexrag-network:
    driver: bridge
