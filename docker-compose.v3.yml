services:
  mysql:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: lexrag, MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-lexrag-demo}" }
    volumes: [lexrag_v3_mysql:/var/lib/mysql]
    healthcheck: { test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"], interval: 10s, timeout: 5s, retries: 15 }
    networks: [private]
  redis:
    image: redis:7-alpine
    volumes: [lexrag_v3_redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 10 }
    networks: [private]
  api:
    build: { context: ., target: api }
    # 兼容本仓库既有的 create_all 开发表；随后以 Alembic 记录版本并补种 v3 数据。
    command: sh -c "python -c 'from app.db.session import init_db; init_db()' && alembic upgrade head && uvicorn api:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-lexrag-demo}@mysql:3306/lexrag?charset=utf8mb4"
      REDIS_URL: redis://redis:6379/0
      LAW_UPDATE_SNAPSHOT_DIR: /app/data/law_snapshots
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?set-a-local-demo-secret}"
    volumes: [lexrag_v3_chroma:/app/data/chroma_db, lexrag_v3_data:/app/data/uploads, lexrag_v3_law_snapshots:/app/data/law_snapshots]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_healthy } }
    networks: [private]
  mcp:
    build: { context: ., target: api }
    profiles: ["mcp"]
    command: python -m app.mcp_server
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-lexrag-demo}@mysql:3306/lexrag?charset=utf8mb4"
      MCP_DEMO_USER_ID: "${MCP_DEMO_USER_ID:?set-the-local-mcp-user-id}"
      MCP_DEMO_ORGANIZATION_ID: "${MCP_DEMO_ORGANIZATION_ID:?set-the-local-organization-id}"
    volumes: [lexrag_v3_chroma:/app/data/chroma_db]
    depends_on: { api: { condition: service_started } }
    networks: [private]
  mcp-http:
    build: { context: ., target: api }
    profiles: ["mcp-http"]
    command: python -m app.mcp_server
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-lexrag-demo}@mysql:3306/lexrag?charset=utf8mb4"
      LEXRAG_MCP_TRANSPORT: streamable-http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8001
      MCP_ALLOWED_HOSTS: localhost:8001,127.0.0.1:8001
      MCP_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      MCP_HTTP_BEARER_TOKEN: "${MCP_HTTP_BEARER_TOKEN:?set-a-local-mcp-bearer-token}"
      MCP_DEMO_USER_ID: "${MCP_DEMO_USER_ID:?set-the-local-mcp-user-id}"
      MCP_DEMO_ORGANIZATION_ID: "${MCP_DEMO_ORGANIZATION_ID:?set-the-local-organization-id}"
    volumes: [lexrag_v3_chroma:/app/data/chroma_db]
    ports: ["127.0.0.1:8001:8001"]
    depends_on: { api: { condition: service_started } }
    networks: [private]
  worker:
    build: { context: ., target: api }
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    environment: { DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-lexrag-demo}@mysql:3306/lexrag?charset=utf8mb4", REDIS_URL: redis://redis:6379/0, LAW_UPDATE_SNAPSHOT_DIR: /app/data/law_snapshots }
    volumes: [lexrag_v3_chroma:/app/data/chroma_db, lexrag_v3_data:/app/data/uploads, lexrag_v3_law_snapshots:/app/data/law_snapshots]
    depends_on: { api: { condition: service_started } }
    networks: [private]
  beat:
    build: { context: ., target: api }
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
    environment: { DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-lexrag-demo}@mysql:3306/lexrag?charset=utf8mb4", REDIS_URL: redis://redis:6379/0, LAW_UPDATE_SNAPSHOT_DIR: /app/data/law_snapshots }
    volumes: [lexrag_v3_law_snapshots:/app/data/law_snapshots]
    depends_on: { api: { condition: service_started } }
    networks: [private]
  vue:
    build: ./frontend
    ports: ["127.0.0.1:8080:3000"]
    depends_on: { api: { condition: service_started } }
    networks: [private]
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:9090:9090"]
    networks: [private]
  grafana:
    image: grafana/grafana:11.5.1
    ports: ["127.0.0.1:3000:3000"]
    volumes: [./infra/grafana:/etc/grafana/provisioning:ro, lexrag_v3_grafana:/var/lib/grafana]
    networks: [private]
volumes: { lexrag_v3_mysql: {}, lexrag_v3_redis: {}, lexrag_v3_chroma: {}, lexrag_v3_data: {}, lexrag_v3_law_snapshots: {}, lexrag_v3_grafana: {} }
networks: { private: { driver: bridge } }
